version: '3.8'

services:
  # 1. MongoDB Database Container
  mongodb:
    image: docker.io/library/mongo:7.0
    container_name: clinic_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: clinic_db
    volumes:
      - ./data/mongo:/data/db
    networks:
      - clinic_net

  # 2. Node.js & Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/clinic_db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - clinic_net

  # 3. React Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic_frontend
    restart: unless-stopped
    ports:
      - "${CLINIC_PORT:-3080}:80"
    depends_on:
      - backend
    networks:
      - clinic_net

networks:
  clinic_net:
    driver: bridge
